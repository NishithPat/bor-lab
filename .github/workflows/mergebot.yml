name: mergebot

# THE FIXED MERGE GATE — the change a team actually ships.
#
# The vulnerable version of this workflow grepped comment text for the
# verdict, so a review bot that merely QUOTED "VERDICT: SAFE TO MERGE"
# inside its own security warning satisfied the gate and merged the
# attacker's PR. No bot ships a "hardened" mode flag; the fix is this
# workflow edit, committed over .github/workflows/mergebot.yml on main
# (Station 3 does the commit live). The gate stops reading comment text
# entirely: it fetches the review bot's own status artifact through the
# API and parses it as data, requiring
#   1. the verdict to be the artifact's final content line,
#   2. the artifact's author to be the one allowlisted bot identity,
#   3. the reviewed commit to still equal the PR head,
# and then merges through controlled code (a `gh pr merge` under the
# mergebot App identity — never AI text in a shell, and a real identity
# so the post-merge `ci` beacon still fires).
#
# codegenie edits its status comment in place, so we listen for created *and*
# edited. The triggering comment is only the wake-up event; the gate reads
# the status artifact, not the comment.
on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge:
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Same identity constraint as the vulnerable gate: the merge must be
      # performed by the mergebot App, not the auto GITHUB_TOKEN, or the
      # post-merge `ci` beacon never fires (GitHub's recursion prevention).
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      # Mint the installation token for the mergebot-dutralab GitHub App.
      # The merge is attributed to mergebot-dutralab[bot], not the
      # presenter's personal account.
      - name: Mint mergebot app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MERGEBOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: "[gate 0/4] Fetch the review status comment"
        id: status
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${APP_TOKEN:-$GITHUB_TOKEN}"
          # Every PR comment, then keep only those carrying the codegenie
          # status marker, and take the newest one by created_at.
          gh api --paginate "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100" \
            --jq '.[] | select(.body | contains("codegenie:status-comment"))' \
            > /tmp/markers.ndjson
          jq -s 'sort_by(.created_at) | last // {}' /tmp/markers.ndjson > /tmp/status.json
          author="$(jq -r '.user.login // ""' /tmp/status.json)"
          jq -r '.body // ""' /tmp/status.json > /tmp/status.md
          printf 'author=%s\n' "$author" >> "$GITHUB_OUTPUT"
          if [ -z "$author" ]; then
            echo "[gate 0/4] no codegenie status comment found"
            exit 1
          fi
          echo "[gate 0/4] status comment author=$author"

      - name: "[gate 1/4] Verdict must be the final content line"
        run: |
          set -euo pipefail
          # Strip the status marker line, drop blank lines, and take the last
          # remaining line. A verdict quoted mid-body (inside a finding) is not
          # the final line and must not satisfy the gate.
          last="$(sed '/codegenie:status-comment/d' /tmp/status.md \
            | sed -e 's/[[:space:]]*$//' \
            | grep -v '^[[:space:]]*$' \
            | tail -n1 || true)"
          if [ "$last" != "VERDICT: SAFE TO MERGE" ]; then
            if grep -qF "VERDICT: SAFE TO MERGE" /tmp/status.md; then
              echo "[gate 1/4] verdict quoted, not final line; DENY (merge denied — gate working)"
            else
              echo "[gate 1/4] no verdict as the final content line; DENY (merge denied — gate working)"
            fi
            exit 1
          fi
          echo "[gate 1/4] verdict is the final content line; pass"

      - name: "[gate 2/4] Status comment author must be the allowlisted bot"
        env:
          # Read through env:, never interpolated into the shell (AI/API output
          # is data). This is the "pass via env:, never expression
          # interpolation" principle.
          ACTUAL: ${{ steps.status.outputs.author }}
          EXPECTED: ${{ vars.REVIEW_BOT_LOGIN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED:-}" ]; then
            echo "[gate 2/4] author allowlist: REVIEW_BOT_LOGIN unset; DENY (fail closed)"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "[gate 2/4] author allowlist: actual=$ACTUAL expected=$EXPECTED; DENY"
            exit 1
          fi
          echo "[gate 2/4] author allowlist: actual=$ACTUAL expected=$EXPECTED; pass"

      - name: "[gate 3/4] Reviewed commit must match the PR head"
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${APP_TOKEN:-$GITHUB_TOKEN}"
          # The reviewed head sha is the short sha in parentheses at the end of
          # the status comment's Git line, e.g. ... from main to branch (`9caf2026a9`).
          gitline="$(grep -i 'git:' /tmp/status.md | tail -n1 || true)"
          paren="$(grep -oE '\([^)]*\)' <<<"$gitline" | tail -n1 || true)"
          reviewed="$(grep -oE '[0-9a-f]{7,40}' <<<"$paren" | tail -n1 || true)"
          if [ -z "$reviewed" ]; then
            echo "[gate 3/4] no reviewed sha in status comment; DENY (fail closed)"
            exit 1
          fi
          head="$(gh api "repos/$REPO/pulls/$ISSUE_NUMBER" --jq .head.sha)"
          case "$head" in
            "$reviewed"*) ;;
            *) echo "[gate 3/4] PR changed after review: reviewed=$reviewed head=$head; DENY"; exit 1 ;;
          esac
          echo "[gate 3/4] reviewed commit matches PR head ($reviewed); pass"

      - name: "[gate 4/4] Merge (all controls passed)"
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${APP_TOKEN:-$GITHUB_TOKEN}"
          # Structural control: the merge is a controlled `gh pr merge`, and
          # every value checked above was parsed as data (env: + explicit
          # string compare) — never AI output interpolated into a shell
          # command. Treat AI output as untrusted; pass via env:, never
          # expression interpolation of untrusted text.
          #
          # Announce BEFORE merging, with the controls that passed (auto
          # GITHUB_TOKEN: posts as github-actions[bot], no workflow loop).
          GH_TOKEN="$GITHUB_TOKEN" gh pr comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "🤖 **mergebot** (fixed gate): all four controls passed — verdict is the reviewer's own final content line, author is the allowlisted review bot, reviewed commit matches the PR head, merge runs as controlled code. Merging." || true
          echo "[gate 4/4] all controls passed; merging PR #$ISSUE_NUMBER"
          gh pr merge "$ISSUE_NUMBER" --repo "$REPO" --merge
