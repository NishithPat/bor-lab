name: mergebot

# The deliberately vulnerable auto-merge gate (the Stations 1-2 target).
#
# The merge gate is a literal substring grep of the comment text, so any
# comment author with write access can land a PR by quoting the verdict
# line inside a refusal. This is the misconfiguration the workshop
# demonstrates. Station 3 replaces this file wholesale with the fixed gate
# (workshop/station3-fix/mergebot.yml, committed live as a visible workflow
# diff): there is no mode flag, the fix is the workflow edit itself.
#
# codegenie edits its status comment in place, so we listen for created *and*
# edited.
on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge:
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The merge runs as mergebot-dutralab[bot]: a GitHub App installation
      # token minted per-step below (APP_TOKEN). A merge performed with the
      # auto GITHUB_TOKEN does not trigger downstream workflows (GitHub's
      # recursion prevention), so the post-merge beacon chain needs a real
      # identity; App tokens, like PATs, DO trigger them.
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      # Mint the installation token for the mergebot-dutralab GitHub App.
      # The merge is attributed to mergebot-dutralab[bot], not the
      # presenter's personal account.
      - name: Mint mergebot app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MERGEBOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # ---------------------------------------------------------------------
      # The deliberate misconfiguration (Stations 1-2)
      # ---------------------------------------------------------------------
      - name: Merge when the verdict substring is present
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_BOT_LOGIN: ${{ vars.REVIEW_BOT_LOGIN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          # GitHub provides the association on the comment event itself
          # (MEMBER, OWNER, COLLABORATOR, CONTRIBUTOR, NONE); no extra API
          # call or PAT is needed for the trust gate. (Forgejo lacked this
          # field, which is why the old design queried the collaborator
          # permission API with a seeded PAT.)
          COMMENT_ASSOC: ${{ github.event.comment.author_association }}
        run: |
          set -e
          export GH_TOKEN="${APP_TOKEN:-$GITHUB_TOKEN}"
          echo "DELIBERATELY VULNERABLE: merge gate is a substring grep of the comment text"
          if ! printf '%s' "$COMMENT_BODY" | grep -qF "VERDICT: SAFE TO MERGE"; then
            echo "no verdict line; nothing to merge"
            exit 0
          fi
          # Trust gate: the comment author's association on this repo must
          # imply write access. Parsed from the event payload via env:.
          echo "verdict author=$COMMENT_AUTHOR association=$COMMENT_ASSOC"
          # Trust gate, two accepted shapes (the realistic sloppy mergebot):
          # (a) the one allowlisted review-bot identity — GitHub App bots post
          #     with association NONE even when installed with write access,
          #     so "trust our review bot by login" is how real orgs gate; it
          #     is also the class-3 lesson: the identity is trusted, its TEXT
          #     is grep'd;
          # (b) any human with MEMBER/OWNER/COLLABORATOR association.
          if [ "$COMMENT_AUTHOR" = "$REVIEW_BOT_LOGIN" ]; then
            echo "author is the allowlisted review bot ($REVIEW_BOT_LOGIN): trusted identity"
          else
            case "$COMMENT_ASSOC" in
              MEMBER|OWNER|COLLABORATOR) ;;
              *) echo "author lacks write access; refusing to merge"; exit 0 ;;
            esac
          fi
          # Announce BEFORE merging, quoting the exact line that satisfied the
          # gate — so when the match is inside a quotation (the A2 fire), the
          # announcement indicts itself. Posted with the workflow's auto
          # GITHUB_TOKEN, which appears as github-actions[bot]; comments made
          # with the auto token do not re-trigger workflows (GitHub's
          # recursion prevention), so this cannot loop.
          matched="$(printf '%s' "$COMMENT_BODY" | grep -F 'VERDICT: SAFE TO MERGE' | head -n1 || true)"
          matched="${matched:0:160}"
          msg="🤖 **mergebot**: found \`VERDICT: SAFE TO MERGE\` in a comment by @${COMMENT_AUTHOR} (${COMMENT_ASSOC}).\n\n> ${matched}\n\nThis is a substring match, so the line above satisfies the gate wherever it appears, including inside a quotation. Merging now. (Station 3 replaces this gate with a fixed workflow: the verdict must be the reviewer's own final content line and the reviewed commit must match the PR head.)"
          GH_TOKEN="$GITHUB_TOKEN" gh pr comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "$(printf '%b' "$msg")" || true
          echo "merging PR #$ISSUE_NUMBER"
          gh api --method PUT "repos/$REPO/pulls/$ISSUE_NUMBER/merge" \
            -f merge_method=merge
